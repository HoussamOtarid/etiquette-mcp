# Release notes for GitHub releases, generated from conventional commits (https://git-cliff.org).
[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.breaking %} (**breaking**){% endif %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/HoussamOtarid/etiquette-mcp/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^refactor", group = "<!-- 2 -->Refactoring" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^ci", group = "<!-- 4 -->CI" },
  { message = "^chore", group = "<!-- 5 -->Chores" },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
