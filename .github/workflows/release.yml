name: Release

# On a version tag: check, publish the Docker image to GitHub Container Registry, then create the GitHub release.
# Releases are created for every version tag that has none yet, so earlier versions get theirs too.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/houssamotarid/etiquette-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Create missing releases with notes from the commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(git tag --list 'v*' --sort=version:refname)
          latest=$(echo "$tags" | tail -n 1)
          previous=$(git rev-list --max-parents=0 HEAD)
          for tag in $tags; do
            if ! gh release view "$tag" > /dev/null 2>&1; then
              npx --yes git-cliff@2.14.2 --config cliff.toml "$previous..$tag" --strip all > notes.md
              image="ghcr.io/houssamotarid/etiquette-mcp:${tag#v}"
              if docker manifest inspect "$image" > /dev/null 2>&1; then
                printf '\n### Docker image\n\n`%s`\n' "$image" >> notes.md
              fi
              if [ "$tag" = "$latest" ]; then latest_flag=--latest; else latest_flag=--latest=false; fi
              gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag "$latest_flag"
            fi
            previous=$tag
          done
