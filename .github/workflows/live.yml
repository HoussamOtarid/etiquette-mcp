name: Live sources

# Weekly check that every source still answers and parses (stores change their sites). Fails, and GitHub emails the
# owner, when a reference product is not found or a source answers with an error.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run smoke -- --check
        env:
          # Chronodrive refuses GitHub's runner IPs (HTTP 403); its parsing is covered by the fixture tests, and its
          # live health by the server's list_sources.
          DISABLED_SOURCES: chronodrive
